[package]
name = "notewise-cli"
description = "Notewise command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "notewise"
path = "src/main.rs"

[dependencies]
notewise-storage.workspace = true
notewise-graph.workspace = true
notewise-ai-router.workspace = true
notewise-api-server.workspace = true
notewise-mcp-server.workspace = true
notewise-recorder.workspace = true
notewise-audio-capture.workspace = true
notewise-transcription.workspace = true
clap.workspace = true
tokio = { workspace = true }
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Live device capture. Pulls the platform audio SDK.
#
# Forwarded to api-server as well, or `notewise serve` would start an engine that cannot
# record, list devices, or import — while the same binary's `notewise record` could. One
# binary reporting two different sets of capabilities is a bug report waiting to happen.
record = ["notewise-audio-capture/os-capture", "notewise-api-server/record"]
# Real transcription. Pulls a cmake build of whisper.cpp.
whisper = ["notewise-recorder/whisper", "notewise-api-server/whisper"]
# The ONNX transducer, as an alternative to Whisper. Separate from `whisper` because it
# pulls ONNX Runtime, which a Whisper-only build has no use for.
parakeet = ["notewise-transcription/parakeet"]
# Same, but fetches ONNX Runtime at build time instead of expecting one on the system.
# Without this the link fails on `_OrtGetApiBase`, which is not an obvious error to meet.
parakeet-download = ["parakeet", "notewise-transcription/parakeet-download"]
whisper-metal = [
    "whisper",
    "notewise-recorder/whisper-metal",
    "notewise-api-server/whisper-metal",
]
# Acoustic speaker separation on imports. Pulls ONNX Runtime.
#
# Forwarded to api-server for the same reason `record` is: otherwise `notewise serve` reports a
# capability the engine behind it does not have, and the setting turns on to no effect.
speaker-diarization = ["notewise-api-server/speaker-diarization"]
# Same, but fetches ONNX Runtime at build time instead of expecting one on the system. Without
# this the link fails on `_OrtGetApiBase`, which is not an obvious error to meet.
speaker-diarization-download = [
    "speaker-diarization",
    "notewise-api-server/speaker-diarization-download",
]
# Everything needed to actually record a meeting on this machine.
full = ["record", "whisper-metal"]
