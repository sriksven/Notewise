name: pages

# Publishes apps/website to GitHub Pages.
#
# Separate from `frontend.yml` even though both build a site in apps/: that workflow gates
# merges and this one deploys, and a deploy job in a required check would mean every failed
# publish blocks a pull request that has nothing to do with the website.
on:
  push:
    branches: [main]
    # Only when the site or this workflow actually changes. An engine fix should not
    # redeploy a page that is byte-identical.
    paths:
      - "apps/website/**"
      - ".github/workflows/pages.yml"
  # So the site can be republished without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages to mint the deployment token.
  id-token: write

# One deploy at a time, and never cancel one midway — a half-finished publish would leave the
# site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - run: npm ci

      # `npm run build` typechecks first, so a broken script fails here rather than shipping
      # a page whose buttons do nothing.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
