name: frontend

# Separate from `core` for the reason stated there: a broken frontend toolchain must not block
# an engine fix. These jobs are cheap and fully offline — no browser, no engine, no network —
# so they run on every push rather than on a schedule.
#
# This workflow exists because it did not: the desktop app had over a hundred tests and a
# typecheck that nothing in CI ever ran, which meant "it compiles" rested entirely on whoever
# last happened to run it by hand.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # One failing app should not hide a second one failing differently.
      fail-fast: false
      matrix:
        app: [desktop, web-dashboard]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if the lockfile
      # and manifest disagree, which is the check worth having in CI.
      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Catches what a typecheck does not: a Tailwind class that does not exist, an import
      # that resolves in dev and not in a production build, a bundle that fails to chunk.
      - name: Build
        run: npx vite build

  # The Tauri shell, which nothing checked at all.
  #
  # Not in the `core` workflow: that one says outright that a broken desktop toolchain must not block
  # an engine fix, and `tauri-build` needs the frontend's `dist/` — which is gitignored, so it only
  # exists after a build. So it goes here, where the build already happens, and after it.
  #
  # Its own job rather than a step on `apps`, because that one is a matrix over two frontends and the
  # shell belongs to one of them.
  #
  # This crate is outside the cargo workspace and had never been compiled by CI in any form. Adding
  # it found a clippy error on the first run.
  # macOS, not ubuntu, and not a matrix. Three reasons, in order of how much they cost me:
  #
  # The shell is the only crate in the repository that compiles `unsafe`, and every line of it is
  # macOS: ScreenCaptureKit, the accessibility API, Carbon hotkeys, Vision. A Linux run compiles the
  # `cfg`-else branches — the stubs that refuse with a reason — so it checks the part that has no
  # `unsafe` in it and skips the part that does. That is the wrong half.
  #
  # It is also the platform I can reproduce. A Linux Tauri build needs a webview and a window
  # toolkit from apt, and when this job was ubuntu it failed for a reason I could not read, could
  # not reproduce, and could only have guessed at.
  #
  # And the shell ships on macOS. Nobody runs it on Linux yet, so a Linux failure would block a
  # merge over a target that has no users.
  shell:
    name: desktop shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Before clippy, not beside it: `tauri.conf.json` points `frontendDist` at `dist/`, which is
      # gitignored, and `tauri-build` fails on a fresh checkout if it is not there. Nothing about
      # the Rust here needs the built frontend — the build script does.
      - name: Frontend
        run: npm ci && npx vite build
        working-directory: apps/desktop

      # `cargo fmt --all` at the repository root does not reach this crate — it is excluded from
      # the workspace, so rustfmt never sees it and drift here was caught by nothing. Found the
      # hard way: unformatted code sat in `main.rs` while every `fmt` gate reported clean.
      - name: Formatting
        run: cargo fmt --check

      # Both ways round. Without the feature is what a default build ships; with it is the only
      # thing in the repository that compiles `unsafe`, and it is not in the workspace clippy runs
      # over.
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Lints with the assistant
        run: cargo clippy --all-targets --features assistant -- -D warnings
        working-directory: apps/desktop/src-tauri

  website:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - run: npm ci

      # Its own job rather than a row in the matrix above: the site is a static document with
      # no unit tests, and `npm test` would have to be a lie to fit. Typecheck and build are
      # the real checks — a build failure here is a page whose buttons do nothing.
      #
      # `pages.yml` also builds it, but only on pushes to main. This runs on pull requests,
      # which is where a break should be caught.
      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  extension:
    name: browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies and no lockfile — the extension is plain JavaScript tested with
      # node's own runner, which is deliberate: an extension that ships a bundler's output is
      # harder to audit, and this one asks for zero permissions.
      - name: Tests
        run: npm test
