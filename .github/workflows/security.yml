name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. New advisories land against unchanged code, so this cannot only run on push.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit --deny warnings

      # The desktop app sits outside the workspace with a lockfile of its own, and that lockfile —
      # not the one above — is what every installer is built from. Nothing audited it: the
      # quinn-proto and rustls advisories that turned this job red on 2026-08-31 were in it too.
      #
      # The ignores are Tauri's to fix, not ours. glib (unsound) and proc-macro-error (unmaintained)
      # arrive through gtk 0.18, on Linux only; the unic-* crates (unmaintained) through Tauri's own
      # build crates. They are named one at a time rather than dropping --deny warnings, so a newly
      # yanked or unsound crate in the shipped tree still fails this.
      - name: Audit the desktop app's lockfile
        run: >-
          cargo audit --deny warnings --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2025-0075
          --ignore RUSTSEC-2025-0080
          --ignore RUSTSEC-2025-0081
          --ignore RUSTSEC-2025-0098
          --ignore RUSTSEC-2025-0100

  licenses:
    name: license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # This project is open-core; a copyleft dependency reaching core/ would be a
      # licensing problem discovered far too late if nothing checked for it.
      - name: Check licenses and bans
        run: cargo deny check licenses bans
