name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. New advisories land against unchanged code, so this cannot only run on push.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit --deny warnings

  licenses:
    name: license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # This project is open-core; a copyleft dependency reaching core/ would be a
      # licensing problem discovered far too late if nothing checked for it.
      - name: Check licenses and bans
        run: cargo deny check licenses bans
