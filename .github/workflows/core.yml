name: core

# The engine is what every platform depends on, so this runs on every push and PR.
# Platform app builds are separate workflows: they need signing identities and SDKs,
# and a broken desktop toolchain must not block an engine fix.
on:
  push:
    branches: [main]
  pull_request:
  # For the expensive combination below, which is too slow to run on every push and too important
  # to run never. See the `heavy` job.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI while leaving local builds quiet.
  RUSTFLAGS: -D warnings

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The engine ships on all three. SQLite pragmas, path handling, and the
        # audio-capture backend selection all differ per platform, so testing only
        # on Linux would miss real breakage.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        # Tests needing a GPU, a signed bundle, a TCC grant, or a paid API key are
        # marked #[ignore] with a reason, so a green run here never implies they passed.
        run: cargo test --workspace

      - name: Doc tests
        run: cargo test --workspace --doc

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to rust-version in the workspace manifest. Raising the MSRV should be a
      # deliberate change, not something that happens because a dependency moved.
      #
      # Raised 1.82 → 1.86, verified by checking against each toolchain rather than
      # inferred. Edition 2024 forces 1.85 — 22 crates already in the lockfile (clap,
      # indexmap, hashbrown, rand, getrandom, zeroize, ort) have adopted it — and the
      # `icu` crates reqwest pulls in need 1.86 on top of that. Holding 1.82 would mean
      # pinning all of them to older releases and forgoing their security updates.
      - uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Optional features are how the local-only build stays local-only. If one stops
      # compiling in isolation, that guarantee is gone without anyone noticing.
      - name: storage without encryption
        run: cargo check -p notewise-storage --no-default-features

      - name: transcription without whisper
        run: cargo check -p notewise-transcription --no-default-features

      - name: audio-capture without OS backends
        run: cargo check -p notewise-audio-capture --no-default-features

      # `onnx` without `onnx-download` expects a system ONNX Runtime, which would fail to *link* —
      # `cargo check` stops before that, and `ort`'s build script does not need the library either
      # (verified by cleaning `ort` and re-checking). So this type-checks the acoustic diarization
      # path without a 50 MB download in CI.
      - name: api-server with acoustic speaker separation
        run: cargo check -p notewise-api-server --features speaker-diarization --all-targets

      - name: diarization with onnx
        run: cargo check -p notewise-diarization --features onnx --all-targets

      # The desktop assistant's platform layer. Cheap to check — no cmake, no ONNX, no SDK — and the
      # only thing in the workspace that compiles `unsafe`, which makes it the last feature that
      # should go unchecked. On Linux it compiles to the refusal path, which is also worth knowing
      # still compiles.
      - name: os-input without the platform layer
        run: cargo check -p notewise-os-input --all-targets

      - name: api-server with external tools
        run: cargo check -p notewise-api-server --features assistant --all-targets

  # The direction the matrix above misses: code behind an *enabled* feature is never compiled by
  # the default build, so `cargo build --workspace` stays green while a real desktop build is
  # broken. That happened — the import path moved a `ModelStore` a later line still needed, and
  # only a `record` build could see it.
  #
  # On macOS rather than Linux because that is the platform `os-capture` targets: `screencapturekit`
  # is declared only for `cfg(target_os = "macos")`, so a Linux run would check a materially
  # different set of code. The compile errors this exists to catch are platform-independent anyway.
  capture:
    name: capture features (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Not `--features full`: that adds whisper, which is a cmake build of whisper.cpp and minutes
      # of CI for a dependency this check is not about.
      - name: api-server with capture
        run: cargo check -p notewise-api-server --features record --all-targets

      - name: cli with capture and speaker separation
        run: cargo check -p notewise-cli --features record,speaker-diarization --all-targets

      # The assistant's `unsafe` half, which only exists on macOS. Tests as well as a check: the
      # CoreFoundation round trips, the whole pasteboard including a real save-and-restore, and the
      # event-synthesis allocation discipline all run without any permission, and they are the parts
      # where being wrong is a crash rather than a compile error.
      - name: os-input platform layer
        run: cargo test -p notewise-os-input --features os-input

      - name: shell with the assistant
        run: cargo check --features assistant
        working-directory: apps/desktop/src-tauri

  # The combination nothing else checks, on a schedule rather than never.
  #
  # `--features full` pulls a cmake build of whisper.cpp, which is minutes of CI for a dependency
  # most changes have nothing to do with — so it is not on the per-push path. It is also the
  # combination that has actually broken: `Pipeline::retaining_audio` consumed `self` and could fail,
  # so the import path borrowed a moved value, and *nothing compiled that code* for long enough that
  # the break was discovered by hand. Weekly is not fast, and it is not never.
  heavy:
    name: full build (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: api-server with everything
        run: cargo check -p notewise-api-server --features full-assistant --all-targets

      - name: cli with everything
        run: cargo check -p notewise-cli --features full --all-targets
