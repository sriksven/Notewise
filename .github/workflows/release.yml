name: release

# Builds the desktop app for all three platforms and attaches the installers to a GitHub
# Release.
#
# # Nothing here is signed
#
# Signing macOS needs a paid Apple Developer ID, and notarisation needs an Apple account to
# submit to. Neither exists for this project, so the macOS artifacts are unsigned and Gatekeeper
# will refuse to open them until the user clears the quarantine attribute — the release notes say
# so in as many words. Windows is unsigned too and will show a SmartScreen warning. Linux needs no
# signing at all, so `.deb` and `.AppImage` are the only fully first-class artifacts here.
#
# When a Developer ID exists, this file gains `APPLE_CERTIFICATE`, `APPLE_SIGNING_IDENTITY` and
# notarisation credentials, and the honest warnings below come out.
on:
  push:
    tags: ["v*"]
  # So the build can be exercised without cutting a tag. A dispatch run uploads artifacts and
  # stops short of publishing a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide a second failing differently.
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            # Metal is an Apple GPU API and exists nowhere else.
            features: bundle
            bundles: dmg
          - name: windows
            os: windows-latest
            features: bundle-cpu
            bundles: nsis,msi
          - name: linux
            os: ubuntu-22.04
            features: bundle-cpu
            bundles: deb,appimage

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Rust is preinstalled on every GitHub runner image, so no toolchain action is downloaded
      # here. That is deliberate: a release must not fail because codeload rate-limited an
      # action download, which is exactly how `core` and `security` went red on 2026-08-17.
      - name: Rust version
        run: rustc --version && cargo --version

      # Tauri's webview, plus ALSA headers for `cpal` and cmake for whisper.cpp. Pinned to
      # 22.04 because `libwebkit2gtk-4.1` is what Tauri v2 wants and 24.04 moved on.
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            cmake

      - run: npm ci

      # `beforeBuildCommand` in tauri.conf.json runs `npm run build`, which typechecks first, so
      # a broken frontend fails here rather than shipping an app with a blank window.
      - name: Build
        run: npx tauri build --features ${{ matrix.features }} --bundles ${{ matrix.bundles }}

      # Collected by name rather than by globbing the whole bundle directory, which also holds
      # the unpacked `.app` and intermediates that need not be uploaded twice.
      #
      # `rw.*` is excluded deliberately. create-dmg writes a temporary read-write image called
      # `rw.<pid>.<name>.dmg` next to the app and removes it on success — so it is only present
      # when the dmg step *failed*, and uploading it would publish a broken installer under a
      # name close enough to the real one to be missed. Seen locally mid-build.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p ../../dist-release
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' \) \
            -not -name 'rw.*' \
            -exec cp {} ../../dist-release/ \;
          ls -lh ../../dist-release
          # An empty directory here means the bundler silently produced nothing.
          [ -n "$(ls -A ../../dist-release)" ] || { echo "no installers were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: notewise-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # A dispatch run is a build check, not a release. Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What was built
        run: ls -lh artifacts

      # `gh` is preinstalled on the runner, so this needs no action download either.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          | Platform | File | Status |
          |---|---|---|
          | macOS | `.dmg` | Unsigned — see below |
          | Windows | `.msi` or `.exe` | Unsigned — SmartScreen will warn |
          | Linux | `.deb` or `.AppImage` | Ready to install |

          ### macOS: clearing the quarantine

          These builds are not signed with an Apple Developer ID, so macOS will say the app
          "is damaged and can't be opened". It is not damaged — that is the message macOS shows
          for any unsigned application. To run it:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Notewise.app
          ```

          Only do that for software you have a reason to trust. If you would rather not, the
          engine builds from source with no signing involved at all — see the README.

          ### What is in this build

          Local transcription, search, notes, tickets and the agent. **System audio capture is
          not included**: it needs ScreenCaptureKit against a signed bundle, which is the same
          missing Developer ID.
          NOTES

          gh release create "${GITHUB_REF_NAME}" \
            --title "Notewise ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            artifacts/*
