[package]
name = "notewise-ai-router"
description = "Unified interface over local, BYOK, and hosted AI backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
# For the local hour, read at the request boundary so `policy::RequestFacts` stays pure and
# every selection rule is testable without a clock.
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
