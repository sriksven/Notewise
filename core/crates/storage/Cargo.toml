[package]
name = "notewise-storage"
description = "Local encrypted SQLite storage and repositories for Notewise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

[features]
default = []
# Encryption at rest via SQLCipher. Off by default because it swaps the bundled SQLite
# for a bundled SQLCipher build, which is significantly slower to compile. See
# Database::open_encrypted and docs/architecture/data-model.md.
sqlcipher = ["rusqlite/bundled-sqlcipher"]

[dev-dependencies]
tempfile.workspace = true
