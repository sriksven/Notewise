[package]
name = "notewise-audio-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Optional: real device capture. Pulls in the platform audio SDK, which a default
# build should not require.
cpal = { version = "0.15", optional = true }

rustfft.workspace = true

# System-audio capture on macOS. Safe bindings, so this crate keeps `forbid(unsafe_code)`.
# macOS-only by target, because ScreenCaptureKit does not exist elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", optional = true }

[features]
default = []
# Real OS capture backends. Off by default: they pull platform audio SDKs and, on
# macOS, require a signed bundle with a TCC grant that cannot be obtained headlessly.
os-capture = ["dep:cpal", "dep:screencapturekit"]
