[package]
name = "notewise-transcription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio = { workspace = true }
async-trait.workspace = true
notewise-audio-capture.workspace = true
# Optional: pulls in a cmake build of whisper.cpp. ~13s on an M4, but it is a C++
# toolchain dependency that a default build should not require.
whisper-rs = { version = "0.14", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = []
# whisper.cpp inference. Off by default: needs a C++ toolchain (cmake + clang) and a
# 150MB-1.5GB model download, neither of which belongs in a default `cargo build`.
whisper = ["dep:whisper-rs"]
# GPU acceleration via Metal on Apple silicon. Measured ~1.5x over CPU on an M4.
whisper-metal = ["whisper", "whisper-rs/metal"]
# GPU acceleration via CUDA on NVIDIA hardware.
whisper-cuda = ["whisper", "whisper-rs/cuda"]
# GPU acceleration via Vulkan (AMD/Intel).
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
