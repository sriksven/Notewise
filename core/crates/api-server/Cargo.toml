[package]
name = "notewise-api-server"
description = "Localhost-bound REST API over the Notewise engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
notewise-storage.workspace = true
notewise-graph.workspace = true
notewise-ai-router.workspace = true
notewise-transcription.workspace = true
notewise-connectors.workspace = true
notewise-mcp-client.workspace = true

# The desktop assistant's foundation: hotkey validation, insertion tiers, screen-context reduction.
#
# Not optional, and the reason is worth stating because the spec's architecture says the engine
# should not depend on this crate. With its `os-input` feature off — the default, and what CI
# builds — it is pure logic: no platform SDK, no `unsafe`, no permission of any kind. What that
# rule protects against is the assistant's *platform* requirements reaching an engine build, and a
# feature that is off does not reach anything. Depending on it unconditionally is what lets the
# dictation endpoints exist in every build and say honestly that they cannot run.
notewise-os-input.workspace = true
notewise-macos-permissions.workspace = true
cron.workspace = true
iana-time-zone = "0.1"
chrono-tz.workspace = true

# Not optional, for the same reason `notewise-transcription` is not: the speaker-events endpoint
# accepts a `SpeakerTimeline` and applies it to a stored meeting, which a build that cannot record
# still needs to do — the browser extension reports who was speaking whether or not this engine
# captured the audio. Neither crate pulls a platform SDK by default; only their inference and
# capture backends are gated.
notewise-diarization.workspace = true
notewise-recorder.workspace = true
axum.workspace = true
tokio = { workspace = true }
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
futures-util.workspace = true
# Exchanging a Microsoft authorization code. One POST, on a path the connectors crate cannot own
# because the loopback listener is what has the PKCE verifier.
reqwest.workspace = true
tokio-stream.workspace = true

# Capture is optional. A default build is a read/query/summarize engine with no platform audio
# SDKs and no cmake; `--features record,whisper` turns it into one that can record.
notewise-audio-capture = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
# Only to implement `AiBackend` for the scripted test backend that drives the agent loop.
# Not a runtime dependency: this crate consumes the trait, it does not implement it.
async-trait.workspace = true

[features]
default = []
# Microphone capture. Pulls the platform audio SDK.
record = ["dep:notewise-audio-capture", "notewise-audio-capture/os-capture"]
# Real transcription. Pulls a cmake build of whisper.cpp.
#
# `notewise-transcription` itself is not optional — the model catalogue and download endpoints
# need it whether or not this build can record. Only the inference backend is gated.
whisper = ["notewise-transcription/whisper", "notewise-recorder/whisper"]
whisper-metal = [
    "whisper",
    "notewise-transcription/whisper-metal",
    "notewise-recorder/whisper-metal",
]
# Acoustic speaker separation. Pulls ONNX Runtime.
#
# Nothing in this crate is `#[cfg]`-gated on it: `SpeakerEmbedder` compiles either way and
# reports `Unavailable` without it, so the routes and the settings exist in every build and say
# so honestly. The feature only decides whether the model can actually run.
speaker-diarization = ["notewise-diarization/onnx"]
# The same, fetching the ONNX Runtime binaries rather than expecting a system install.
#
# Depends on `speaker-diarization` rather than only on the downstream feature: without that, a
# build with just this flag has a working model while this crate's own feature reads as off, and
# the two disagree about what the build can do.
speaker-diarization-download = [
    "speaker-diarization",
    "notewise-diarization/onnx-download",
]

# The desktop assistant's platform layer: global hotkeys, and typing into other applications.
#
# Off by default because it is the only thing in this crate that compiles `unsafe`, and because
# every path behind it needs the Accessibility grant — which no CI machine can hold. Without it the
# dictation endpoints still exist and report why they cannot insert, which is the honest shape.
assistant = ["notewise-os-input/os-input"]

# Everything needed for the desktop app to actually record.
full = ["record", "whisper"]
full-metal = ["record", "whisper-metal"]
# Everything, including the assistant.
full-assistant = ["full", "assistant"]
