[workspace]
resolver = "2"
members = [
    "core/crates/audio-capture",
    "core/crates/macos-permissions",
    "core/crates/transcription",
    "core/crates/diarization",
    "core/crates/ai-router",
    "core/crates/storage",
    "core/crates/graph",
    "core/crates/connectors",
    "core/crates/sync-client",
    "core/crates/api-server",
    "core/crates/mcp-server",
    "core/crates/mcp-client",
    "core/crates/recorder",
    "core/crates/eval",
    "core/crates/ffi",
    "apps/cli",
]

# apps/desktop/src-tauri is intentionally NOT a workspace member. Tauri pulls a large
# dependency tree and a webview toolchain; keeping it out means `cargo test --workspace`
# stays fast and CI for the engine does not depend on GUI build tooling.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/notewise/notewise"
authors = ["Notewise contributors"]

[workspace.dependencies]
# Internal crates. Path-based within the workspace; versioned so core/ can be published
# independently of the apps that consume it (see docs/architecture/overview.md §versioning).
notewise-storage = { path = "core/crates/storage", version = "0.1.0" }
notewise-graph = { path = "core/crates/graph", version = "0.1.0" }
notewise-ai-router = { path = "core/crates/ai-router", version = "0.1.0" }
notewise-audio-capture = { path = "core/crates/audio-capture", version = "0.1.0" }
notewise-macos-permissions = { path = "core/crates/macos-permissions", version = "0.1.0" }
notewise-transcription = { path = "core/crates/transcription", version = "0.1.0" }
notewise-diarization = { path = "core/crates/diarization", version = "0.1.0" }
notewise-api-server = { path = "core/crates/api-server", version = "0.1.0" }
notewise-mcp-server = { path = "core/crates/mcp-server", version = "0.1.0" }
notewise-mcp-client = { path = "core/crates/mcp-client", version = "0.1.0" }
notewise-recorder = { path = "core/crates/recorder", version = "0.1.0" }
notewise-connectors = { path = "core/crates/connectors", version = "0.1.0" }

# Shared third-party versions, pinned once so crates cannot drift apart.
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
axum = "0.7"
rustfft = "6"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
keyring = "3"
# Verifying entitlement grants. Public-key so the client holds no secret capable of forging one —
# an HMAC would mean shipping the signing key to every machine.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Cron parsing for scheduled jobs. Writing one is a bad use of effort and a good source of
# off-by-one bugs around DST.
cron = "0.17"
chrono-tz = "0.10"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
